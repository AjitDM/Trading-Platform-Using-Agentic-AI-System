services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  llm-gateway:
    build:
      context: ./gateway
    env_file:
      - .env
    ports:
      - "4000:4000"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      LLM_GATEWAY_URL: http://llm-gateway:4000
    depends_on:
      - postgres
      - redis
      - llm-gateway
    ports:
      - "8000:8000"

volumes:
  postgres_data: